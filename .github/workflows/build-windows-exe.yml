name: Build Windows Release (TEST BUILD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl PySide6 pyinstaller reportlab pillow

      - name: Build the .exe
        run: |
          pyinstaller --noconfirm --windowed --name Project_Matching_Assistant_TEST_BUILD `
            main.py

      - name: Convert README to PDF
        run: python scripts/build_readme_pdf.py README.md README.pdf

      - name: Assemble the release folder
        run: |
          New-Item -ItemType Directory -Force -Path "Project_Matching_Assistant_TEST_BUILD_Windows"
          Copy-Item -Recurse "dist\Project_Matching_Assistant_TEST_BUILD\*" "Project_Matching_Assistant_TEST_BUILD_Windows\"
          if (Test-Path "README.pdf") { Copy-Item "README.pdf" "Project_Matching_Assistant_TEST_BUILD_Windows\" }
        shell: pwsh

      - name: Upload the release folder as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project_Matching_Assistant_TEST_BUILD_Windows
          path: Project_Matching_Assistant_TEST_BUILD_Windows/
          retention-days: 90
